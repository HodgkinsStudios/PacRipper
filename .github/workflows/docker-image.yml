name: Docker Image

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/hodgkinsstudios/pacripper

jobs:
  docker-runtime-check:
    name: Docker ROM-free runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Docker toolchain
        run: |
          docker version
          docker buildx version || true
          python3 --version

      - name: Build local Docker image
        run: docker build --pull -t pacripper:ci .

      - name: Run Docker ROM-free runtime gates
        env:
          PACRIPPER_DOCKER_IMAGE: pacripper:ci
        run: |
          python3 scripts/test_docker_runtime.py

      - name: Inspect runtime image
        run: |
          docker image inspect pacripper:ci
          docker history --no-trunc pacripper:ci

  publish:
    name: Publish multi-architecture GHCR image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: docker-runtime-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=1.0
            type=raw,value=1.0.0
            type=sha,prefix=sha-

      - name: Build and publish linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
