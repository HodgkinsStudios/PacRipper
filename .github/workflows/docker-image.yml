name: Docker Image

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/hodgkinsstudios/pacripper

jobs:
  docker-runtime-check:
    name: Docker ROM-free runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Docker toolchain
        run: |
          docker version
          docker buildx version || true
          python3 --version

      - name: Build local Docker image
        run: docker build --pull -t pacripper:ci .

      - name: Run Docker ROM-free runtime gates
        env:
          PACRIPPER_DOCKER_IMAGE: pacripper:ci
        run: python3 scripts/test_docker_runtime.py

      - name: Inspect runtime image
        run: |
          docker image inspect pacripper:ci
          docker history --no-trunc pacripper:ci

  platform-runtime-check:
    name: Docker native ${{ matrix.arch }} runtime gates
    needs: docker-runtime-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show native runner
        run: |
          uname -a
          uname -m
          docker version
          python3 --version

      - name: Build native platform image
        run: docker build --pull --platform ${{ matrix.platform }} -t pacripper:platform .

      - name: Run native platform ROM-free runtime gates
        env:
          PACRIPPER_DOCKER_IMAGE: pacripper:platform
        run: python3 scripts/test_docker_runtime.py

  publish-platform:
    name: Publish native ${{ matrix.arch }} image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: platform-runtime-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish native ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  publish-manifest:
    name: Publish multi-architecture GHCR manifest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release manifest
        shell: bash
        run: |
          set -euo pipefail
          AMD64="${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64"
          ARM64="${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64"

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:1.0" \
            -t "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            "$AMD64" "$ARM64"

      - name: Verify multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          INSPECT="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest")"
          printf '%s\n' "$INSPECT"
          grep -q 'linux/amd64' <<<"$INSPECT"
          grep -q 'linux/arm64' <<<"$INSPECT"

      - name: Verify anonymous pullability
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"
