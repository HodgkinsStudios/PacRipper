name: Release Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release-check:
    name: Linux ROM-free release gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          python3 --version
          g++ --version
          make --version

      - name: Run strict ROM-free local gates
        run: make release-check

      - name: Confirm repository contains no ROM archives or generated outputs
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( \
              -iname '*.7z' -o -iname '*.rar' -o -iname '*.rom' -o -iname '*.prom' \
              -o -iname '*.bin' -o -iname '*.asm' \
            \) -print -quit | grep -q .; then
            echo 'Forbidden ROM/archive/generated-source artifact found:'
            find . -type f \( \
              -iname '*.7z' -o -iname '*.rar' -o -iname '*.rom' -o -iname '*.prom' \
              -o -iname '*.bin' -o -iname '*.asm' \
            \) -print
            exit 1
          fi
          echo 'Repository artifact guard: PASS'
